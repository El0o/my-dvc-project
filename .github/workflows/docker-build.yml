name: Build and Publish Docker Image

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Get repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # Enable Docker BuildKit
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate with Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and publish the image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          tags: |
            ${{ vars.DOCKERHUB_REPOSITORY }}:latest
            ${{ vars.DOCKERHUB_REPOSITORY }}:${{ github.sha }}

          build-args: |
            MLFLOW_TRACKING_URI=${{ vars.MLFLOW_TRACKING_URI }}
            MLFLOW_EXPERIMENT_NAME=${{ vars.MLFLOW_EXPERIMENT_NAME }}
            MLFLOW_RUN_NAME=${{ vars.MLFLOW_RUN_NAME }}
            MLFLOW_ARTIFACT_PATH=${{ vars.MLFLOW_ARTIFACT_PATH }}

          secrets: |
            MLFLOW_TRACKING_USERNAME=${{ secrets.MLFLOW_TRACKING_USERNAME }}
            MLFLOW_TRACKING_PASSWORD=${{ secrets.MLFLOW_TRACKING_PASSWORD }}
